docs/contracts/openapi.yaml:
  # OAuth redirects are successful protocol responses, not 2xx JSON responses.
  operation-2xx-response:
    - '#/paths/~1auth~1google~1start/get/responses'
    - '#/paths/~1auth~1google~1callback/get/responses'
  # These endpoints intentionally expose no client-error response: start redirects, health is public.
  operation-4xx-response:
    - '#/paths/~1auth~1google~1start/get/responses'
    - '#/paths/~1health/get/responses'
    - '#/paths/~1health~1ready/get/responses'
