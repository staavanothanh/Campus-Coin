        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
components:
  headers:
    PrivateNoStore:
      description: Không lưu response riêng tư trong browser hoặc shared cache.
      schema:
        type: string
        example: no-store, private
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cc_session
      description: Opaque server-side session cookie; không phải JWT.
  parameters:
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Month: {name: month, in: query, required: true, schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}, example: '2026-09'}
    TransactionId: {name: transactionId, in: path, required: true, schema: {type: string}}
    CategoryId: {name: categoryId, in: path, required: true, schema: {type: string}}
    IssueId: {name: issueId, in: path, required: true, schema: {type: string}}
  responses:
    BadRequest: {description: Request body JSON không hợp lệ, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    PayloadTooLarge: {description: Request vượt giới hạn kích thước, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: "Thiếu, hết hạn hoặc bị revoke session", headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    LoginForbidden: {description: "Origin không hợp lệ, tài khoản bị vô hiệu hoặc email chưa xác minh", headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    OriginInvalid: {description: Origin của request không được phép, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    CsrfInvalid: {description: Origin không hợp lệ hoặc CSRF token thiếu/sai; error code trong body phân biệt hai trường hợp, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Không đủ quyền, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Không tìm thấy resource hoặc resource ngoài owner scope, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: Xung đột state hoặc uniqueness, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    IdempotencyConflict: {description: Idempotency key đã dùng với body khác, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ValidationError: {description: Input không hợp lệ, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    DomainValidationError: {description: Vi phạm domain hoặc invariant, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    RateLimited: {description: Vượt rate limit, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}, Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    InternalError: {description: Lỗi server đã được sanitize, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    WalletAlreadyInitialized: {description: Wallet đã khởi tạo, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ServiceUnavailable: {description: Dependency chưa sẵn sàng, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    TransactionType: {type: string, enum: [income, payment]}
    Locale: {type: string, enum: [en, vi]}
    MoneyVnd: {type: integer, minimum: 0, description: Số nguyên VND; không dùng floating point}
    PositiveMoneyVnd: {type: integer, minimum: 1, description: Số nguyên VND dương}
    User:
      type: object
      required: [id, displayName, email, locale, role]
      properties:
        id: {type: string}
        displayName: {type: string}
        email: {type: string, format: email}
        locale: {$ref: '#/components/schemas/Locale'}
        role: {type: string, enum: [user, admin, security]}
    UserResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/User'}}}
    Session:
      type: object
      required: [user, csrfToken, googleLinked]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrfToken: {type: string, description: Token dùng trong memory cho state-changing request}
        googleLinked: {type: boolean, description: Cho biết tài khoản hiện tại đã kết nối Google hay chưa}
    SessionResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Session'}}}
    AuthProvidersResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [google]
          properties:
            google: {type: boolean}
    GoogleLinkStartResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url]
          properties:
            url: {type: string, format: uri}
    UpdatePreferencesRequest:
      type: object
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120}
        locale: {$ref: '#/components/schemas/Locale'}
    Wallet:
      type: object
      required: [walletId, initialized, initialBalanceVnd, availableBalanceVnd, currency, updatedAt]
      properties:
        walletId: {type: string}
        initialized: {type: boolean}
        initialBalanceVnd: {$ref: '#/components/schemas/MoneyVnd'}
        availableBalanceVnd: {$ref: '#/components/schemas/MoneyVnd'}
        currency: {type: string, const: VND}
        updatedAt: {type: string, format: date-time}
    WalletResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Wallet'}}}
    WalletBaselineRequest:
      type: object
      required: [initialBalanceVnd]
      properties: {initialBalanceVnd: {$ref: '#/components/schemas/MoneyVnd'}}
    CreateTransactionRequest:
      type: object
      required: [type, amountVnd, categoryId, occurredAt]
      properties:
        type: {$ref: '#/components/schemas/TransactionType'}
        amountVnd: {$ref: '#/components/schemas/PositiveMoneyVnd'}
        categoryId: {type: string}
        occurredAt: {type: string, format: date-time}
        description: {type: string, maxLength: 500}
        confirmedCategorySuggestion: {type: boolean, default: false}
    CorrectionRole: {type: string, enum: [reversal, adjustment, replacement]}
    TransactionRole: {type: string, enum: [original, reversal, adjustment, replacement]}
    CreateCorrectionRequest:
      type: object
      required: [correctionRole, reason]
      properties:
        correctionRole: {$ref: '#/components/schemas/CorrectionRole'}
        reason: {type: string, minLength: 1, maxLength: 1000}
        newAmountVnd: {$ref: '#/components/schemas/PositiveMoneyVnd'}
        newCategoryId: {type: string}
    Transaction:
      type: object
      required: [id, type, amountVnd, categoryId, occurredAt, role, createdAt]
      properties:
        id: {type: string}
        type: {$ref: '#/components/schemas/TransactionType'}
        amountVnd: {$ref: '#/components/schemas/PositiveMoneyVnd'}
        categoryId: {type: string}
        occurredAt: {type: string, format: date-time}
        description: {type: [string, 'null']}
        role: {$ref: '#/components/schemas/TransactionRole'}
        referenceId: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    BudgetWarning:
      type: object
      required: [isOverrun, limitVnd, usedVnd]
      properties:
        isOverrun: {type: boolean}
        limitVnd: {$ref: '#/components/schemas/MoneyVnd'}
        usedVnd: {$ref: '#/components/schemas/MoneyVnd'}
    TransactionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [transaction]
          properties:
            transaction: {$ref: '#/components/schemas/Transaction'}
            budgetWarning: {$ref: '#/components/schemas/BudgetWarning'}
    PageMeta:
      type: object
      required: [hasNext]
      properties:
        cursor: {type: [string, 'null']}
        hasNext: {type: boolean}
    TransactionPageResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Transaction'}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    Savings:
      type: object
      required: [balanceVnd, currency, updatedAt]
      properties:
        balanceVnd: {$ref: '#/components/schemas/MoneyVnd'}
        currency: {type: string, const: VND}
        updatedAt: {type: string, format: date-time}
    SavingsResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Savings'}}}
    TransferDirection: {type: string, enum: [deposit, withdraw]}
    CreateSavingsTransferRequest:
      type: object
      required: [direction, amountVnd]
      properties:
        direction: {$ref: '#/components/schemas/TransferDirection'}
        amountVnd: {$ref: '#/components/schemas/PositiveMoneyVnd'}
        note: {type: string, maxLength: 500}
    SavingsTransfer:
      type: object
      required: [id, direction, amountVnd, createdAt]
      properties:
        id: {type: string}
        direction: {$ref: '#/components/schemas/TransferDirection'}
        amountVnd: {$ref: '#/components/schemas/PositiveMoneyVnd'}
        note: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    SavingsTransferResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/SavingsTransfer'}}}
    SavingsTransferPageResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/SavingsTransfer'}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    CategoryStatus: {type: string, enum: [active, disabled, retired]}
    Category:
      type: object
      required: [id, name, appliesTo, status, isDefault]
      properties:
        id: {type: string}
        name: {type: object, required: [en, vi], properties: {en: {type: string}, vi: {type: string}}}
        appliesTo: {$ref: '#/components/schemas/TransactionType'}
        status: {$ref: '#/components/schemas/CategoryStatus'}
        isDefault: {type: boolean}
    CategoryResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Category'}}}
    CategoryListResponse: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Category'}}}}
    CreateCategoryRequest:
      type: object
      required: [nameEn, appliesTo]
      properties:
        nameEn: {type: string, minLength: 1, maxLength: 80}
        nameVi: {type: string, maxLength: 80}
        appliesTo: {$ref: '#/components/schemas/TransactionType'}
    UpdateCategoryRequest:
      type: object
      minProperties: 1
      properties:
        nameEn: {type: string, minLength: 1, maxLength: 80}
        nameVi: {type: string, maxLength: 80}
        status: {$ref: '#/components/schemas/CategoryStatus'}
    Budget:
      type: object
      required: [categoryId, month, limitVnd, usedVnd, isOverrun]
