openapi: 3.1.0
info:
  title: Campus Coin API
  version: 1.0.0-mvp
  license: {name: MIT, identifier: MIT}
  description: |
    Hợp đồng HTTP canonical cho Campus Coin MVP; auth email là register → verify OTP → login → session và forgot password → reset password.
    Google Sign-In là lựa chọn bổ sung qua OIDC; không dùng Gmail credential cá nhân, inbox hoặc Gmail API.
    Mutation cần Origin thuộc allowlist; Referer không thay thế Origin. API response và redirect dùng Cache-Control: no-store, private.
    API không trao quyền tính số dư, authorize payment hoặc ghi tiền cho client/JEV.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: campus-coin.vercel.app
  - url: https://localhost.invalid/api/v1
    description: Môi trường phát triển local; override bằng biến môi trường khi chạy thật
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: Đăng ký email, xác minh OTP, đăng nhập và quản lý session.
  - name: Wallet
    description: Số dư ví authoritative và opening balance.
  - name: Ledger
    description: Ghi nhận income/payment và correction append-only.
  - name: Savings
    description: Aggregate và transfer savings riêng biệt với ledger.
  - name: Categories
    description: Category hệ thống và category do user tạo.
  - name: Budgets
    description: Budget theo tháng HCMC; overrun chỉ là cảnh báo.
  - name: Reports
    description: Báo cáo deterministic do server tính.
  - name: Issues
    description: Issue hỗ trợ và timeline append-only.
  - name: Admin
    description: Triage issue và đọc audit đã redact.
  - name: JEV
    description: JEV optional; endpoint chưa mở trong API runtime.
  - name: Health
    description: Liveness và readiness của API.
paths:
  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [Auth]
      security: []
      summary: Gửi OTP để bắt đầu đăng ký bằng email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          description: Mã OTP đã gửi; tài khoản chưa được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403': {$ref: '#/components/responses/OriginInvalid'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/verify-registration:
    post:
      operationId: postAuthVerifyRegistration
      tags: [Auth]
      security: []
      summary: Xác minh OTP và tạo tài khoản bằng email, họ tên, mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationRequest'
      responses:
        '200':
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          description: Xác minh thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403': {$ref: '#/components/responses/OriginInvalid'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/resend-otp:
    post:
      operationId: postAuthResendOtp
      tags: [Auth]
      security: []
      summary: Gửi lại mã OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
      responses:
        '200':
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          description: OTP đã gửi lại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403': {$ref: '#/components/responses/OriginInvalid'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [Auth]
      security: []
      summary: Đăng nhập email và mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          description: Đăng nhập thành công, thiết lập session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/LoginForbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/providers:
    get:
      operationId: getAuthProviders
      tags: [Auth]
      security: []
      summary: Lấy các phương thức đăng nhập đang được cấu hình
      responses:
        '200': {description: Phương thức hiện có, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AuthProvidersResponse'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/google/start:
    get:
      operationId: getAuthGoogleStart
      tags: [Auth]
      security: []
      summary: Bắt đầu Google Sign-In bằng OAuth Authorization Code và PKCE
      responses:
        '302': {description: Chuyển trình duyệt đến Google; cookie flow ngắn hạn được thiết lập, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}, Location: {schema: {type: string, format: uri}}, Set-Cookie: {schema: {type: string}}}}
        default: {description: Lỗi chuyển hướng đã được xử lý an toàn, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}}
  /auth/google/link:
    post:
      operationId: postAuthGoogleLink
      tags: [Auth]
      summary: Bắt đầu kết nối Google từ tài khoản đã đăng nhập
      x-csrf-required: true
      responses:
        '200': {description: URL xác thực Google và cookie flow, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}, Set-Cookie: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/GoogleLinkStartResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/google/callback:
    get:
      operationId: getAuthGoogleCallback
      tags: [Auth]
      security: []
      summary: Hoàn tất callback OIDC Google và chuyển về ứng dụng
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302': {description: Chuyển về ứng dụng; thiết lập session khi đăng nhập thành công, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}, Location: {schema: {type: string, format: uri}}, Set-Cookie: {schema: {type: string}}}}
        default: {description: Lỗi callback được chuyển về ứng dụng bằng mã lỗi an toàn, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}}
  /auth/forgot-password:
    post:
      operationId: postAuthForgotPassword
      tags: [Auth]
      security: []
      summary: Yêu cầu OTP đặt lại mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          description: Phản hồi tiêu chuẩn không để lộ sự tồn tại của email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403': {$ref: '#/components/responses/OriginInvalid'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/reset-password:
    post:
      operationId: postAuthResetPassword
      tags: [Auth]
      security: []
      summary: Đặt lại mật khẩu với OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          description: Đặt lại mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403': {$ref: '#/components/responses/OriginInvalid'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      tags: [Auth]
      summary: Lấy CSRF token
      responses:
        '200':
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          description: Token CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
  /users/me:
    get:
      operationId: getUsersMe
      tags: [Auth]
      summary: Lấy thông tin user hiện tại (owner scope)
      responses:
        '200':
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          description: Thông tin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
  /users/{userId}:
    get:
      operationId: getUsersByUserId
      tags: [Auth]
      summary: Lấy thông tin user theo ID (chống IDOR - chỉ cho phép lấy id của chính mình)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          description: Thông tin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [Auth]
      summary: Lấy người dùng và CSRF token của phiên hiện tại
      responses:
        '200':
          description: Session hợp lệ
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Auth]
      summary: Revoke session hiện tại; yêu cầu CSRF khi phiên còn hiệu lực, thao tác lặp là idempotent
      x-csrf-required: true
      responses:
        '200': {description: Session đã revoke và cookie được clear, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}}}}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /users/me/preferences:
    patch:
      operationId: patchUsersMePreferences
      tags: [Auth]
      summary: Cập nhật preference người dùng
      x-csrf-required: true
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePreferencesRequest'}}}}
      responses:
        '200': {description: Preference đã cập nhật, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /wallet:
    get:
      operationId: getWallet
      tags: [Wallet]
      summary: Lấy wallet authoritative của user hiện tại
      responses:
        '200': {description: Wallet, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WalletResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
  /wallet/baseline:
    post:
      operationId: postWalletBaseline
      tags: [Wallet]
      summary: Khởi tạo opening wallet balance một lần
      x-csrf-required: true
      x-idempotency-required: true
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WalletBaselineRequest'}}}}
      responses:
        '201': {description: Wallet đã khởi tạo, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WalletResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '409': {$ref: '#/components/responses/WalletAlreadyInitialized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /ledger/transactions:
    get:
      operationId: getLedgerTransactions
      tags: [Ledger]
      summary: Liệt kê ledger transaction của user hiện tại
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/TransactionType'}}
        - {name: categoryId, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Ledger page, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/TransactionPageResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: postLedgerTransactions
      tags: [Ledger]
      summary: Tạo income hoặc payment immutable
      x-csrf-required: true
      x-idempotency-required: true
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateTransactionRequest'}}}}
      responses:
        '201': {description: Transaction đã commit, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/TransactionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/DomainValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /ledger/transactions/{transactionId}:
    get:
      operationId: getLedgerTransactionsByTransactionId
      tags: [Ledger]
      summary: Lấy một transaction
      parameters: [{$ref: '#/components/parameters/TransactionId'}]
      responses:
        '200': {description: Transaction, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/TransactionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
  /ledger/transactions/{transactionId}/corrections:
    post:
      operationId: postLedgerTransactionsByTransactionIdCorrections
      tags: [Ledger]
      summary: Tạo correction append-only
      x-csrf-required: true
      x-idempotency-required: true
      parameters: [{$ref: '#/components/parameters/TransactionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateCorrectionRequest'}}}}
      responses:
        '201': {description: Correction đã commit, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/TransactionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/DomainValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /savings:
    get:
      operationId: getSavings
      tags: [Savings]
      summary: Lấy savings aggregate
      responses:
        '200': {description: Savings, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SavingsResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
  /savings/transfers:
    get:
      operationId: getSavingsTransfers
      tags: [Savings]
      summary: Liệt kê savings transfer
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Savings transfer page, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SavingsTransferPageResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: postSavingsTransfers
      tags: [Savings]
      summary: Gửi hoặc rút savings atomic
      x-csrf-required: true
      x-idempotency-required: true
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateSavingsTransferRequest'}}}}
      responses:
        '201': {description: Transfer đã commit, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SavingsTransferResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/DomainValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/InternalError'}
  /categories:
    get:
      operationId: getCategories
      tags: [Categories]
      summary: Liệt kê category system và user
      parameters:
        - {name: appliesTo, in: query, schema: {$ref: '#/components/schemas/TransactionType'}}
        - {name: includeDisabled, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Categories, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryListResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: postCategories
      tags: [Categories]
      summary: Tạo custom category
      x-csrf-required: true
      x-idempotency-required: true
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateCategoryRequest'}}}}
      responses:
        '201': {description: Category đã tạo, headers: {Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
