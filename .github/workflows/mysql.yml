name: MySQL Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.41
        env:
          MYSQL_ROOT_PASSWORD: ci-local-only-test-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-local-only-test-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CAMPUS_COIN_DB_HOST: 127.0.0.1
      CAMPUS_COIN_DB_PORT: 3306
      CAMPUS_COIN_DB_NAME: campus_coin_test_bootstrap
      CAMPUS_COIN_DB_USER: root
      CAMPUS_COIN_DB_PASSWORD: ci-local-only-test-password
      CAMPUS_COIN_DB_SSL: disabled
      CAMPUS_COIN_DB_MIGRATE_USER: root
      CAMPUS_COIN_DB_MIGRATE_PASSWORD: ci-local-only-test-password
      CAMPUS_COIN_TEST_DB_ADMIN_USER: root
      CAMPUS_COIN_TEST_DB_ADMIN_PASSWORD: ci-local-only-test-password
      CAMPUS_COIN_CURSOR_SIGNING_KEY: ci-only-cursor-signing-key-at-least-32-bytes-long
      CAMPUS_COIN_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow trigger creation on disposable MySQL
        run: |
          container_id="$(docker ps --filter ancestor=mysql:8.0.41 --format '{{.ID}}')"
          test -n "$container_id"
          docker exec "$container_id" mysql -uroot -pci-local-only-test-password -e "SET GLOBAL log_bin_trust_function_creators=1"
      - name: Generate ephemeral cursor signing key
        shell: bash
        run: |
          cursor_key="$(openssl rand -hex 32)"
          echo "::add-mask::$cursor_key"
          echo "CAMPUS_COIN_CURSOR_SIGNING_KEY=$cursor_key" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: MySQL domain integration
        run: npm run test:mysql:required -- test/mysql.integration.test.ts
        timeout-minutes: 5
      - name: MySQL datatest constraints
        run: CAMPUS_COIN_TEST_DB_ADMIN_USER=root CAMPUS_COIN_TEST_DB_ADMIN_PASSWORD=ci-local-only-test-password npm run db:datatest:ci
        timeout-minutes: 5
      - name: MySQL contract smoke
        run: npm run test:mysql:required -- test/e2e.contract.smoke.test.ts
        timeout-minutes: 5
      - name: MySQL operation log writer
        if: always()
        run: npm run test:mysql:required -- test/operation-log.integration.test.ts
        timeout-minutes: 5
      - name: CLI migration fresh install is idempotent
        if: always()
        run: node scripts/ci-migrate-gate.mjs
        timeout-minutes: 5
      - name: Validate OpenAPI
        if: always()
        run: npm run api:validate
