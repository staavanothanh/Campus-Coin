name: Deploy Campus Coin to Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy after CI has passed
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ inputs.target != 'production' || github.ref == 'refs/heads/hiep' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deploy settings
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in GitHub secrets."
            exit 1
          fi
      - name: Require successful CI for this commit
        shell: bash
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20")
          if ! printf '%s' "$runs" | jq -e --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | select(.status == "completed" and .conclusion == "success")' >/dev/null; then
            echo "Campus Coin CI must complete successfully for this commit before deployment."
            exit 1
          fi
          if [ "$VERCEL_TARGET" = "production" ] && [ "$GITHUB_REF" != "refs/heads/hiep" ]; then
            echo "Production deploys must use the hiep branch."
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@60.0.1
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"
      - name: Build preview
        if: ${{ inputs.target == 'preview' }}
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Build production
        if: ${{ inputs.target == 'production' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy preview
        if: ${{ inputs.target == 'preview' }}
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
      - name: Deploy production
        if: ${{ inputs.target == 'production' }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
